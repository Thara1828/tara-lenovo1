<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Turnover Predictor</title>
<link rel="stylesheet" href="static/styles.css">
</head>
<body>

<header>
<div class="logo">Turnover Predictor</div>
<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>
</header>

<div class="hero">
<div class="hero-content">
<h1>Employee Turnover Prediction</h1>
<p>Determine the likelihood of an employee leaving the company.</p>
</div>
</div>

<div class="form-section">
<h2>Provide Employee Information</h2>
<form id="turnover-form">
<label for="job_role">Job Role:</label>
<input type="text" id="job_role" required><br><br>

<label for="salary">Salary ($):</label>
<input type="number" id="salary" required><br><br>

<label for="experience">Years of Experience:</label>
<input type="number" id="experience" required><br><br>

<label for="hike">Recent Salary Hike (%):</label>
<input type="number" id="hike" required><br><br>

<label for="performance">Performance Score:</label>
<input type="number" id="performance" required><br><br>

<label for="company_tenure">Years in Company:</label>
<input type="number" id="company_tenure" required><br><br>

<label for="role_tenure">Years in Role:</label>
<input type="number" id="role_tenure" required><br><br>

<label for="manager_tenure">Years with Manager:</label>
<input type="number" id="manager_tenure" required><br><br>

<button type="submit">Predict</button>
</form>

<!-- Prediction Output -->
<div id="result"></div>
</div>

<!-- Footer -->
<footer>
<p>&copy; 2025 Turnover Predictor. All rights reserved.</p>
</footer>

<script>
    document.getElementById("turnover-form").addEventListener("submit", function(event) {
        event.preventDefault();

        const inputData = {
            "attributes": [
                document.getElementById("job_role").value,
                parseFloat(document.getElementById("salary").value),
                parseInt(document.getElementById("experience").value),
                parseInt(document.getElementById("hike").value),
                parseInt(document.getElementById("performance").value),
                parseInt(document.getElementById("company_tenure").value),
                parseInt(document.getElementById("role_tenure").value),
                parseInt(document.getElementById("manager_tenure").value)
            ]
        };

        fetch("/predict_turnover", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(inputData)
        })
        .then(response => response.json())
        .then(data => {
            let outputMsg = data.prediction === 1 
                ? "Employee is likely to leave the company." 
                : "Employee is likely to stay in the company.";

            document.getElementById("result").innerHTML =
                `<h3>Prediction: ${outputMsg}</h3>
<p>Attrition Probability: ${data.probability.toFixed(2)}</p>`;
        })
        .catch(error => {
            document.getElementById("result").innerHTML =
                `<p class="error">Error in prediction. Please try again.</p>`;
        });
    });
</script>

</body>
</html>
